services:
  postgres:
    image: postgres:16-alpine
    container_name: hostel_booking_postgres
    environment:
      POSTGRES_DB: hostel_booking
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d hostel_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: hostel_booking_api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/hostel_booking
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-secure-256-bit-secret-key-in-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000,http://localhost:5173}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-MOCK}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-mock-webhook-secret}

volumes:
  pg_data:
