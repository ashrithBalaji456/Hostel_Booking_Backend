spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-super-secret-key-for-local-hostel-booking-platform-256-bits}

logging:
  level:
    com.accommodation.platform: DEBUG
    org.springframework.security: INFO
